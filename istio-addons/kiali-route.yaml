apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kiali-route
  namespace: istio-system
spec:
  parentRefs:
    - name: nlb-gateway
      namespace: istio-ingress
  rules:
    - matches:
        - path: {type: PathPrefix, value: /kiali}
      backendRefs:
        - name: kiali
          port: 20001
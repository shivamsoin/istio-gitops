apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: nlb-gateway
  namespace: istio-ingress
spec:
  gatewayClassName: istio # Replace with your GatewayClass (e.g., 'eg', 'istio', 'cilium')
  infrastructure:
    annotations:
      # AWS Load Balancer Controller triggers
      service.beta.kubernetes.io/aws-load-balancer-type: nlb
      service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing" # Use 'internal' for private subnets
  listeners:
  - allowedRoutes:
      namespaces:
        from: All
    name: http
    port: 80
    protocol: HTTP
  - allowedRoutes:
      namespaces:
        from: All
    name: https
    port: 443
    protocol: HTTPS
